name: A11y Gate (fail-the-build)

# QWF UI Interaction & Accessibility Standard ... machine-checkable subset.
# Runs the vendored checker (.a11y/detect_ui_interaction_gaps.py), which is kept
# BYTE-IDENTICAL to the canonical
#   005 Operations/Execution/detect_ui_interaction_gaps.py
# in the QWU backoffice vault. Drift is hard-gated fleet-wide by
# run_a11y_fleet_sweep.py (fails if any vendored copy's sha256 != canonical).
#
# The gate is PR-native: it annotates each finding inline on the changed lines
# of a pull request. It needs no Node, no build, and no Cloudflare token ... the
# checker is one dependency-free Python file (stdlib only), so it never touches
# the deploy pipeline in deploy.yml.
#
# FAIL-THE-BUILD (Tier-1, TIG-ratified ratchet 2026-07-18): the checker exits
# non-zero on any warning-severity gap and this step carries NO continue-on-error,
# so a finding turns this check RED on pull_request + push:main. HONEST SCOPE: these
# repos have no branch-protection required-status-check yet, so a red check is a
# loud signal, not a merge block ... wiring the a11y job as a required status check
# is a named next lane, not this change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    name: A11y interaction/accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a11y checker (machine-checkable subset, fail-the-build)
        run: python3 .a11y/detect_ui_interaction_gaps.py --github src
